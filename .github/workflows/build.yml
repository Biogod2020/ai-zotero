name: Build AI Zotero Preview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-zotero-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test core and Zotero adapter contracts
        run: npm test
      - name: Build and verify XPI
        run: python3 tools/build.py
      - name: Build offline workspace preview
        run: python3 tools/preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: ai-zotero-preview
          if-no-files-found: error
          path: |
            dist/*.xpi
            dist/*.sha256
            dist/ai-zotero-preview.html
